<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BowlMap — Real Food, Real Shanghai</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<style>
:root{--ink:#1a1208;--paper:#f5f0e8;--red:#c0392b;--gold:#b8860b;--warm:#ede5d3;--muted:#7a6e60;--border:#d4c9b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;font-weight:300;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
header{height:52px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:var(--paper);z-index:200;flex-shrink:0;}
.logo{font-family:"Playfair Display",serif;font-size:1.4rem;font-weight:700;letter-spacing:-.02em;}
.logo span{color:var(--red);}
.city-badge{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--border);padding:.25rem .7rem;color:var(--muted);}
.header-count{font-size:.72rem;color:var(--muted);}
.header-right{display:flex;align-items:center;gap:1rem;}
.app{display:flex;flex:1;overflow:hidden;}
.sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;background:var(--paper);}
.sidebar-top{padding:.8rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.filter-chips{display:flex;flex-wrap:wrap;gap:.35rem;}
.chip{padding:.25rem .7rem;border:1px solid var(--border);font-size:.7rem;cursor:pointer;background:transparent;color:var(--muted);font-family:"DM Sans",sans-serif;transition:all .12s;}
.chip:hover,.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.restaurant-list{flex:1;overflow-y:auto;}
.r-item{padding:1rem 1rem .8rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.r-item:hover{background:var(--warm);}
.r-item.active{background:var(--warm);border-left:3px solid var(--red);}
.r-zh{font-family:"Noto Serif SC",serif;font-size:.78rem;color:var(--muted);margin-bottom:.15rem;}
.r-en{font-family:"Playfair Display",serif;font-size:1rem;font-weight:700;line-height:1.2;margin-bottom:.35rem;}
.r-meta{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.r-tag{font-size:.62rem;padding:.15rem .5rem;border:1px solid var(--border);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;}
.r-price{font-size:.7rem;color:var(--ink);font-weight:500;}
.r-desc{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:.4rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.map-container{flex:1;position:relative;}
#map{width:100%;height:100%;}
.map-marker{width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);cursor:pointer;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s;background:#1a1208;}
.map-marker:hover{transform:rotate(-45deg) scale(1.25);}
.map-marker.star3{background:var(--red);}
.map-marker.star2{background:var(--gold);}
.mapboxgl-popup-content{background:var(--ink)!important;color:var(--paper)!important;border-radius:0!important;padding:1rem 1.2rem!important;max-width:240px;box-shadow:0 4px 20px rgba(0,0,0,.4)!important;}
.mapboxgl-popup-tip{border-top-color:var(--ink)!important;}
.popup-zh{font-family:"Noto Serif SC",serif;font-size:.72rem;opacity:.5;margin-bottom:.2rem;}
.popup-en{font-family:"Playfair Display",serif;font-size:.95rem;font-weight:700;margin-bottom:.4rem;}
.popup-meta{font-size:.7rem;opacity:.6;margin-bottom:.6rem;}
.popup-btn{width:100%;padding:.45rem;background:var(--red);color:white;border:none;font-family:"DM Sans",sans-serif;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.detail-panel{position:absolute;right:0;top:0;bottom:0;width:320px;background:var(--paper);border-left:1px solid var(--border);overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;z-index:100;}
.detail-panel.open{transform:translateX(0);}
.panel-close{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--border);width:28px;height:28px;cursor:pointer;font-size:.8rem;color:var(--muted);}
.panel-close:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.panel-inner{padding:1.4rem;}
.panel-zh{font-family:"Noto Serif SC",serif;font-size:.85rem;color:var(--muted);margin-bottom:.2rem;}
.panel-en{font-family:"Playfair Display",serif;font-size:1.4rem;font-weight:700;line-height:1.15;margin-bottom:.6rem;}
.panel-badges{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem;}
.badge{font-size:.62rem;padding:.2rem .6rem;border:1px solid var(--border);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.badge.red{border-color:var(--red);color:var(--red);}
.badge.gold{border-color:var(--gold);color:var(--gold);}
.panel-desc{font-size:.85rem;color:var(--muted);line-height:1.65;margin-bottom:1.2rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border);}
.sec-title{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem;}
.sec-title::after{content:"";flex:1;height:1px;background:var(--border);}
.dish-row{display:flex;justify-content:space-between;align-items:baseline;padding:.45rem 0;border-bottom:1px dotted var(--border);gap:.8rem;}
.dish-row:last-child{border-bottom:none;}
.dish-en{font-size:.82rem;font-weight:500;}
.dish-zh{font-family:"Noto Serif SC",serif;font-size:.8rem;color:var(--muted);flex-shrink:0;}
.order-btn{width:100%;margin:.8rem 0 1.2rem;padding:.65rem;background:var(--ink);color:var(--paper);border:none;font-family:"DM Sans",sans-serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
.order-btn:hover{background:var(--red);}
.tip-row{font-size:.8rem;padding:.4rem 0;border-bottom:1px dotted var(--border);line-height:1.45;display:flex;gap:.5rem;color:var(--muted);}
.tip-row:last-child{border-bottom:none;}
.comm-bar{position:absolute;bottom:1rem;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:.4rem;background:var(--ink);padding:.5rem .8rem;flex-wrap:wrap;justify-content:center;max-width:600px;}
.comm-pill{padding:.3rem .7rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--paper);font-size:.65rem;cursor:pointer;transition:background .12s;font-family:"DM Sans",sans-serif;}
.comm-pill:hover{background:var(--red);border-color:var(--red);}
.comm-label{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);align-self:center;white-space:nowrap;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,18,8,.82);z-index:1000;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.open{display:flex;}
.modal{background:var(--ink);color:var(--paper);max-width:400px;width:100%;padding:2rem;position:relative;}
.modal-x{position:absolute;top:.8rem;right:.8rem;background:none;border:1px solid rgba(255,255,255,.2);color:var(--paper);width:28px;height:28px;cursor:pointer;font-size:.8rem;}
.modal-hint{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;opacity:.4;margin-bottom:.4rem;}
.modal-title{font-family:"Playfair Display",serif;font-size:1.2rem;margin-bottom:1rem;}
.modal-hr{border:none;border-top:1px solid rgba(255,255,255,.12);margin:.8rem 0;}
.modal-zh-lbl{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;opacity:.4;margin-bottom:.5rem;}
.modal-zh{font-family:"Noto Serif SC",serif;font-size:1.35rem;color:#f5c842;line-height:1.6;margin-bottom:.8rem;}
.modal-dish{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:.8rem;}
.modal-dish:last-child{border-bottom:none;}
.modal-dish-zh{font-family:"Noto Serif SC",serif;color:#f5c842;}
.modal-copy{margin-top:1.2rem;width:100%;padding:.75rem;background:var(--red);color:white;border:none;font-family:"DM Sans",sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
</style>
</head>
<body>
<header>
  <div class="logo">🍜 Bowl<span>Map</span></div>
  <div class="header-right">
    <span class="city-badge">Shanghai</span>
    <span class="header-count" id="hCount">48 restaurants</span>
  </div>
</header>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="filter-chips">
        <button class="chip active" onclick="filterBy('all',this)">All</button>
        <button class="chip" onclick="filterBy('shanghai',this)">Shanghai</button>
        <button class="chip" onclick="filterBy('hotpot',this)">Hotpot</button>
        <button class="chip" onclick="filterBy('western',this)">Western</button>
        <button class="chip" onclick="filterBy('japanese',this)">Japanese</button>
        <button class="chip" onclick="filterBy('snacks',this)">Snacks</button>
        <button class="chip" onclick="filterBy('chinese',this)">Chinese</button>
        <button class="chip" onclick="filterBy('foreign',this)">Intl</button>
      </div>
    </div>
    <div class="restaurant-list" id="rList"></div>
  </div>
  <div class="map-container">
    <div id="map"></div>
    <div class="comm-bar">
      <span class="comm-label">Show to staff →</span>
      <button class="comm-pill" onclick="cp('我不吃辣，请不要放辣椒。',this)">🌶 No spicy</button>
      <button class="comm-pill" onclick="cp('我是素食者，不吃肉、鱼和鸡蛋。',this)">🥗 Vegetarian</button>
      <button class="comm-pill" onclick="cp('我对花生过敏。',this)">⚠️ Peanut allergy</button>
      <button class="comm-pill" onclick="cp('请问可以用Visa或Mastercard付款吗？',this)">💳 Card OK?</button>
      <button class="comm-pill" onclick="cp('请问有英文菜单吗？',this)">📋 English menu?</button>
      <button class="comm-pill" onclick="cp('我不吃猪肉。',this)">🐷 No pork</button>
    </div>
    <div class="detail-panel" id="dPanel">
      <button class="panel-close" onclick="closePanel()">✕</button>
      <div class="panel-inner" id="dInner"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <button class="modal-x" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    <div class="modal-hint">Show this screen to your server</div>
    <div class="modal-title" id="mTitle"></div>
    <hr class="modal-hr">
    <div class="modal-zh-lbl">Point to these dishes</div>
    <div class="modal-zh" id="mZh"></div>
    <div id="mDishes"></div>
    <button class="modal-copy" onclick="copyModal()">Copy Chinese text</button>
  </div>
</div>

const FM = {
  all:()=>true,
  shanghai:r=>r.cuisine==="shanghai"||r.cuisine==="snacks",
  hotpot:r=>r.cuisine==="hotpot",
  western:r=>r.cuisine==="western",
  japanese:r=>r.cuisine==="japanese",
  snacks:r=>r.cuisine==="snacks",
  chinese:r=>r.cuisine==="chinese",
  foreign:r=>r.cuisine==="foreign"
};

let map, markers={}, activeFilter="all";

function sc(n){return n>=3?"star3":n>=2?"star2":"";}
function se(n){return "⭐".repeat(n);}

function renderList(f){
  activeFilter=f;
  const filtered=restaurants.filter(FM[f]||FM.all);
  document.getElementById("hCount").textContent=filtered.length+" restaurants";
  Object.keys(markers).forEach(id=>{
    markers[id].el.style.display=filtered.find(r=>r.id==id)?"block":"none";
  });
  document.getElementById("rList").innerHTML=filtered.map(r=>`
    <div class="r-item" id="li-${r.id}" onclick="pick(${r.id})">
      <div class="r-zh">${r.zh}</div>
      <div class="r-en">${r.en}</div>
      <div class="r-meta">
        <span class="r-tag">${r.cuisineLabel}</span>
        <span class="r-price">${r.price}</span>
        <span>${se(r.stars)}</span>
      </div>
      <div class="r-desc">${r.desc}</div>
    </div>`).join("");
}

function filterBy(f,btn){
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  btn.classList.add("active");
  renderList(f);
}

function pick(id){
  document.querySelectorAll(".r-item").forEach(e=>e.classList.remove("active"));
  const li=document.getElementById("li-"+id);
  if(li){li.classList.add("active");li.scrollIntoView({behavior:"smooth",block:"nearest"});}
  Object.values(markers).forEach(({el})=>el.classList.remove("active"));
  if(markers[id])markers[id].el.classList.add("active");
  const r=restaurants.find(x=>x.id===id);
  if(map)map.flyTo({center:[r.lng,r.lat],zoom:15,duration:500});
  showDetail(r);
}

function showDetail(r){
  document.getElementById("dInner").innerHTML=`
    <div style="margin-bottom:1.2rem">
      <div class="panel-zh">${r.zh}</div>
      <div class="panel-en">${r.en}</div>
      <div class="panel-badges">
        <span class="badge">${r.cuisineLabel}</span>
        <span class="badge gold">${r.price}/person</span>
        ${r.stars>=3?'<span class="badge red">Top Pick</span>':""}
      </div>
      <div class="panel-desc">${r.desc}</div>
    </div>
    <div class="sec-title">What to order</div>
    ${r.dishes.map(d=>`<div class="dish-row"><span class="dish-en">${d.en}</span><span class="dish-zh">${d.zh}</span></div>`).join("")}
    <button class="order-btn" onclick="openModal(${r.id})">📱 Show ordering card to server</button>
    <div class="sec-title">Tips</div>
    ${r.tips.map(t=>`<div class="tip-row"><span style="flex-shrink:0">→</span><span>${t}</span></div>`).join("")}
    <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);font-size:.7rem;color:var(--muted)">📍 ${r.address}</div>`;
  document.getElementById("dPanel").classList.add("open");
}

function closePanel(){
  document.getElementById("dPanel").classList.remove("open");
  document.querySelectorAll(".r-item").forEach(e=>e.classList.remove("active"));
  Object.values(markers).forEach(({el})=>el.classList.remove("active"));
}

function openModal(id){
  const r=restaurants.find(x=>x.id===id);
  document.getElementById("mTitle").textContent=r.en+" · "+r.zh;
  document.getElementById("mZh").textContent=r.dishes.map(d=>d.zh).join(" · ");
  document.getElementById("mDishes").innerHTML=r.dishes.map(d=>`<div class="modal-dish"><span>${d.en}</span><span class="modal-dish-zh">${d.zh}</span></div>`).join("");
  document.getElementById("modal").classList.add("open");
}

function copyModal(){
  const t=document.getElementById("mTitle").textContent+"
"+document.getElementById("mZh").textContent;
  navigator.clipboard.writeText(t).then(()=>{
    const b=document.querySelector(".modal-copy");
    b.textContent="✓ Copied!";setTimeout(()=>b.textContent="Copy Chinese text",2000);
  });
}

function cp(text,btn){
  navigator.clipboard.writeText(text).then(()=>{
    const o=btn.textContent;btn.textContent="✓";
    setTimeout(()=>btn.textContent=o,2000);
  });
}

function initMap(){
  mapboxgl.accessToken="pk.eyJ1IjoidHpoYW4xIiwiYSI6ImNtcGN1Z2EwNzAxaXoyc3NjYnM3b2E0am8ifQ.5DfO7viMVtyeTxM1hxYsvg";
  map=new mapboxgl.Map({
    container:"map",
    style:"mapbox://styles/mapbox/light-v11",
    center:[121.4737,31.2304],
    zoom:12.5,
    attributionControl:false
  });
  map.addControl(new mapboxgl.NavigationControl({showCompass:false}),"top-right");
  map.on("load",()=>{
    restaurants.forEach(r=>{
      const el=document.createElement("div");
      el.className="map-marker "+sc(r.stars);
      el.addEventListener("click",()=>pick(r.id));
      markers[r.id]={
        marker:new mapboxgl.Marker({element:el,anchor:"bottom"}).setLngLat([r.lng,r.lat]).addTo(map),
        el
      };
    });
    renderList("all");
  });
}
</script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js" onload="initMap()"></script>
