<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BowlMap</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<style>
:root{--ink:#1a1208;--paper:#f5f0e8;--red:#c0392b;--gold:#b8860b;--warm:#ede5d3;--muted:#7a6e60;--border:#d4c9b0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;font-weight:300;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
header{height:52px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:var(--paper);z-index:200;flex-shrink:0;}
.logo{font-family:"Playfair Display",serif;font-size:1.4rem;font-weight:700;letter-spacing:-.02em;text-decoration:none;color:var(--ink);}
.logo span{color:var(--red);}
.header-right{display:flex;align-items:center;gap:1rem;}
.city-badge{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--border);padding:.25rem .7rem;color:var(--muted);}
.header-count{font-size:.72rem;color:var(--muted);}
.app{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;background:var(--paper);}
.filters{padding:.7rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.filter-group{margin-bottom:.5rem;}
.filter-group:last-child{margin-bottom:0;}
.filter-label{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;}
.chip{padding:.22rem .65rem;border:1px solid var(--border);font-size:.68rem;cursor:pointer;background:transparent;color:var(--muted);font-family:"DM Sans",sans-serif;transition:all .12s;border-radius:2px;}
.chip:hover{background:var(--warm);border-color:var(--ink);color:var(--ink);}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.chip.scene-active{background:var(--red);color:var(--paper);border-color:var(--red);}
.restaurant-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.r-item{padding:.9rem 1rem .7rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.r-item:hover{background:var(--warm);}
.r-item.active{background:var(--warm);border-left:3px solid var(--red);padding-left:.7rem;}
.r-zh{font-family:"Noto Serif SC",serif;font-size:.75rem;color:var(--muted);margin-bottom:.1rem;}
.r-en{font-family:"Playfair Display",serif;font-size:.95rem;font-weight:700;line-height:1.2;margin-bottom:.3rem;}
.r-meta{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;}
.r-tag{font-size:.6rem;padding:.12rem .45rem;border:1px solid var(--border);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.r-price{font-size:.68rem;color:var(--ink);font-weight:500;}
.r-desc{font-size:.76rem;color:var(--muted);line-height:1.5;margin-top:.35rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* MAP */
.map-container{flex:1;position:relative;}
#map{width:100%;height:calc(100% - 44px);}
.map-marker{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);cursor:pointer;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s;background:#1a1208;}
.map-marker:hover,.map-marker.active{transform:rotate(-45deg) scale(1.3);}
.map-marker.star3{background:var(--red);}
.map-marker.star2{background:var(--gold);}
.mapboxgl-popup-content{background:var(--ink)!important;color:var(--paper)!important;border-radius:0!important;padding:.9rem 1.1rem!important;max-width:220px;box-shadow:0 4px 20px rgba(0,0,0,.4)!important;}
.mapboxgl-popup-tip{border-top-color:var(--ink)!important;}

/* COMM BAR */
.comm-bar{height:44px;background:var(--ink);display:flex;align-items:center;gap:.5rem;padding:0 1rem;overflow-x:auto;flex-shrink:0;white-space:nowrap;}
.comm-bar::-webkit-scrollbar{height:0;}
.comm-label{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);white-space:nowrap;flex-shrink:0;}
.comm-pill{padding:.25rem .65rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:var(--paper);font-size:.65rem;cursor:pointer;transition:all .12s;font-family:"DM Sans",sans-serif;border-radius:2px;white-space:nowrap;flex-shrink:0;}
.comm-pill:hover{background:var(--red);border-color:var(--red);}

/* DETAIL PANEL */
.detail-panel{position:absolute;right:0;top:0;bottom:44px;width:320px;background:var(--paper);border-left:1px solid var(--border);overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;z-index:100;}
.detail-panel.open{transform:translateX(0);}
.panel-close{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--border);width:28px;height:28px;cursor:pointer;font-size:.8rem;color:var(--muted);display:flex;align-items:center;justify-content:center;}
.panel-close:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.panel-inner{padding:1.4rem;}
.panel-zh{font-family:"Noto Serif SC",serif;font-size:.85rem;color:var(--muted);margin-bottom:.2rem;}
.panel-en{font-family:"Playfair Display",serif;font-size:1.35rem;font-weight:700;line-height:1.15;margin-bottom:.6rem;}
.panel-badges{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1rem;}
.badge{font-size:.6rem;padding:.18rem .55rem;border:1px solid var(--border);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.badge.red{border-color:var(--red);color:var(--red);}
.badge.gold{border-color:var(--gold);color:var(--gold);}
.panel-desc{font-size:.84rem;color:var(--muted);line-height:1.65;margin-bottom:1.2rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border);}
.sec-title{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.65rem;display:flex;align-items:center;gap:.5rem;}
.sec-title::after{content:"";flex:1;height:1px;background:var(--border);}
.dish-row{display:flex;justify-content:space-between;align-items:baseline;padding:.42rem 0;border-bottom:1px dotted var(--border);gap:.8rem;}
.dish-row:last-child{border-bottom:none;}
.dish-en{font-size:.8rem;font-weight:500;}
.dish-zh{font-family:"Noto Serif SC",serif;font-size:.78rem;color:var(--muted);flex-shrink:0;}
.order-btn{width:100%;margin:.8rem 0 1.2rem;padding:.62rem;background:var(--ink);color:var(--paper);border:none;font-family:"DM Sans",sans-serif;font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
.order-btn:hover{background:var(--red);}
.tip-row{font-size:.78rem;padding:.38rem 0;border-bottom:1px dotted var(--border);line-height:1.45;display:flex;gap:.5rem;color:var(--muted);}
.tip-row:last-child{border-bottom:none;}

/* COMM MODAL */
.comm-modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,18,8,.85);z-index:2000;align-items:center;justify-content:center;padding:1rem;}
.comm-modal-overlay.open{display:flex;}
.comm-modal{background:var(--ink);color:var(--paper);max-width:380px;width:100%;padding:1.8rem;position:relative;}
.comm-modal-x{position:absolute;top:.8rem;right:.8rem;background:none;border:1px solid rgba(255,255,255,.2);color:var(--paper);width:28px;height:28px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;}
.comm-modal-hint{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;opacity:.4;margin-bottom:.5rem;}
.comm-modal-en{font-size:.85rem;opacity:.65;margin-bottom:.8rem;line-height:1.5;}
.comm-modal-zh{font-family:"Noto Serif SC",serif;font-size:1.7rem;color:#f5c842;line-height:1.5;margin-bottom:.4rem;}
.comm-modal-pinyin{font-size:.78rem;opacity:.35;font-style:italic;margin-bottom:1.2rem;}
.comm-modal-copy{width:100%;padding:.7rem;background:var(--red);color:white;border:none;font-family:"DM Sans",sans-serif;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}

/* ORDER MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,18,8,.82);z-index:1000;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.open{display:flex;}
.modal{background:var(--ink);color:var(--paper);max-width:400px;width:100%;padding:2rem;position:relative;}
.modal-x{position:absolute;top:.8rem;right:.8rem;background:none;border:1px solid rgba(255,255,255,.2);color:var(--paper);width:28px;height:28px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;}
.modal-hint{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;opacity:.4;margin-bottom:.4rem;}
.modal-title{font-family:"Playfair Display",serif;font-size:1.2rem;margin-bottom:1rem;}
.modal-hr{border:none;border-top:1px solid rgba(255,255,255,.12);margin:.8rem 0;}
.modal-zh-lbl{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;opacity:.4;margin-bottom:.5rem;}
.modal-zh{font-family:"Noto Serif SC",serif;font-size:1.3rem;color:#f5c842;line-height:1.6;margin-bottom:.8rem;}
.modal-dish{display:flex;justify-content:space-between;padding:.38rem 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:.78rem;}
.modal-dish:last-child{border-bottom:none;}
.modal-dish-zh{font-family:"Noto Serif SC",serif;color:#f5c842;}
.modal-copy{margin-top:1.2rem;width:100%;padding:.72rem;background:var(--red);color:white;border:none;font-family:"DM Sans",sans-serif;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}

/* FEEDBACK */
.suggest-btn{display:flex;align-items:center;gap:.5rem;margin-top:1.2rem;padding:.55rem .8rem;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:"DM Sans",sans-serif;font-size:.7rem;cursor:pointer;width:100%;letter-spacing:.05em;transition:all .12s;text-decoration:none;}
.suggest-btn:hover{border-color:var(--ink);color:var(--ink);background:var(--warm);}
.fab{position:fixed;bottom:1.5rem;right:1.5rem;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;}
.fab-main{display:flex;align-items:center;gap:.5rem;padding:.6rem 1.1rem;background:var(--ink);color:var(--paper);border:none;font-family:"DM Sans",sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:background .12s;text-decoration:none;}
.fab-main:hover{background:var(--red);}

/* LOADING */
.loading{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;z-index:9999;}
.loading-logo{font-family:"Playfair Display",serif;font-size:2rem;font-weight:700;}
.loading-logo span{color:var(--red);}
.loading-text{font-size:.75rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}

/* ── MOBILE RESPONSIVE ── */
@media screen and (max-width: 768px) {

  /* Stack: map top, list bottom */
  .app { flex-direction: column !important; }
  .map-container { height: 45vh !important; flex: none !important; position: relative !important; z-index: 10; }
  #map { height: calc(100% - 44px) !important; }

  /* Comm bar */
  .comm-bar {
    height: 44px !important;
    padding: 0 .7rem !important;
    gap: .4rem !important;
    position: relative !important;
    z-index: 20 !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch;
  }
  .comm-label { font-size: .55rem !important; opacity: .6; }
  .comm-pill { font-size: .6rem !important; padding: .2rem .5rem !important; }

  /* Sidebar */
  .sidebar {
    width: 100% !important;
    flex: 1 !important;
    border-right: none !important;
    border-top: 2px solid var(--ink) !important;
    overflow: hidden !important;
  }

  /* Filters horizontal scroll */
  .filters { padding: .5rem .8rem !important; }
  .chips { flex-wrap: nowrap !important; overflow-x: auto !important; }
  .chips::-webkit-scrollbar { height: 0; }
  .chip { flex-shrink: 0 !important; font-size: .65rem !important; }

  /* List */
  .r-item { padding: .75rem .9rem .6rem !important; }
  .r-desc { -webkit-line-clamp: 1 !important; }

  /* Detail panel slides up */
  .detail-panel {
    position: fixed !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    top: auto !important;
    width: 100% !important;
    height: 75vh !important;
    border-left: none !important;
    border-top: 2px solid var(--ink) !important;
    transform: translateY(100%) !important;
    transition: transform .3s ease !important;
    z-index: 300 !important;
  }
  .detail-panel.open { transform: translateY(0) !important; }

  .panel-inner { padding: 1rem 1.2rem 1.5rem !important; }
  .panel-inner::before {
    content: '';
    display: block;
    width: 36px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 1rem;
  }
  .panel-close { top: .6rem !important; right: .9rem !important; }

  /* FAB — bottom right corner above list */
  .fab {
    position: fixed !important;
    bottom: calc(55vh + .8rem) !important;
    right: .8rem !important;
    top: auto !important;
    z-index: 400 !important;
  }
  .fab-main { font-size: .6rem !important; padding: .45rem .8rem !important; }

  /* Modals from bottom */
  .comm-modal { max-width: 100% !important; border-radius: 0 !important; }
  .modal { max-width: 100% !important; border-radius: 0 !important; }
  .comm-modal-overlay,
  .modal-overlay { align-items: flex-end !important; padding: 0 !important; }

  /* Header */
  .header-count { display: none !important; }
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-logo">🍜 Bowl<span>Map</span></div>
  <div class="loading-text">Loading city data...</div>
</div>

<header>
  <a class="logo" href="index.html">🍜 Bowl<span>Map</span></a>
  <div class="header-right">
    <span class="city-badge" id="cityBadge">—</span>
    <span class="header-count" id="hCount">— restaurants</span>
  </div>
</header>

<div class="app">
  <div class="sidebar">
    <div class="filters">
      <div class="filter-group">
        <div class="filter-label">By cuisine</div>
        <div class="chips" id="cuisineChips"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">By vibe</div>
        <div class="chips" id="sceneChips">
          <button class="chip" data-vibe="hutong-hidden">Hutong Hidden</button>
          <button class="chip" data-vibe="cheap-eats">Cheap Eats</button>
          <button class="chip" data-vibe="date-night">Date Night</button>
          <button class="chip" data-vibe="instagrammable">Instagrammable</button>
          <button class="chip" data-vibe="special-occasion">Special Occasion</button>
        </div>
      </div>
    </div>
    <div class="restaurant-list" id="rList"></div>
  </div>

  <div class="map-container">
    <div id="map"></div>
    <div class="comm-bar" id="commBar">
      <span class="comm-label">Show to staff →</span>
      <button class="comm-pill" data-zh="我不吃辣，请不要放辣椒。" data-en="I cannot eat spicy food. Please no chilli." data-pinyin="Wǒ bù chī là">🌶 No spicy</button>
      <button class="comm-pill" data-zh="我是素食者，不吃肉、鱼和鸡蛋。" data-en="I am vegetarian. No meat, fish or eggs." data-pinyin="Wǒ shì sùshí zhě">🥗 Vegetarian</button>
      <button class="comm-pill" data-zh="我对花生过敏，请不要放花生。" data-en="I am allergic to peanuts." data-pinyin="Wǒ duì huāshēng guòmǐn">⚠️ Peanut allergy</button>
      <button class="comm-pill" data-zh="请问可以用Visa或Mastercard付款吗？" data-en="Do you accept Visa or Mastercard?" data-pinyin="Kěyǐ shuākǎ ma?">💳 Card OK?</button>
      <button class="comm-pill" data-zh="请问有英文菜单吗？" data-en="Do you have an English menu?" data-pinyin="Yǒu Yīngwén càidān ma?">📋 English menu?</button>
      <button class="comm-pill" data-zh="我不吃猪肉。" data-en="I do not eat pork." data-pinyin="Wǒ bù chī zhūròu">🐷 No pork</button>
      <button class="comm-pill" data-zh="请给我推荐你们最好吃的菜。" data-en="Please recommend your best dishes." data-pinyin="Qǐng gěi wǒ tuījiàn zuì hào chī de cài">⭐ Recommend dishes</button>
      <button class="comm-pill" data-zh="请不要放味精。" data-en="Please no MSG." data-pinyin="Qǐng bù yào fàng wèijīng">🧂 No MSG</button>
    </div>
    <div class="detail-panel" id="dPanel">
      <button class="panel-close" onclick="closePanel()">✕</button>
      <div class="panel-inner" id="dInner"></div>
    </div>
  </div>
</div>

<!-- COMM MODAL -->
<div class="comm-modal-overlay" id="commModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="comm-modal">
    <button class="comm-modal-x" onclick="document.getElementById('commModal').classList.remove('open')">✕</button>
    <div class="comm-modal-hint">Show this screen to your server</div>
    <div class="comm-modal-en" id="cmEn"></div>
    <div class="comm-modal-zh" id="cmZh"></div>
    <div class="comm-modal-pinyin" id="cmPinyin"></div>
    <button class="comm-modal-copy" onclick="copyCommModal()">Copy Chinese text</button>
  </div>
</div>

<!-- ORDER MODAL -->
<div class="modal-overlay" id="orderModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <button class="modal-x" onclick="document.getElementById('orderModal').classList.remove('open')">✕</button>
    <div class="modal-hint">Show this screen to your server</div>
    <div class="modal-title" id="mTitle"></div>
    <hr class="modal-hr">
    <div class="modal-zh-lbl">Point to these dishes</div>
    <div class="modal-zh" id="mZh"></div>
    <div id="mDishes"></div>
    <button class="modal-copy" onclick="copyOrderModal()">Copy Chinese text</button>
  </div>
</div>

rial fermented milk desserts", "vibe": ["cheap-eats"], "price": "¥21/person", "stars": 3, "lat": 39.941, "lng": 116.4004, "address": "东城区鼓楼东大街194号", "desc": "A tiny dessert counter near Gulou Dongdajie carrying a palace dairy recipe over ten years old. The traditional court cheese has a silky, pudding-like texture quite unlike Western cheese. Summer brings a hand-simmered sour plum drink.", "dishes": [{"en": "Traditional imperial court cheese", "zh": "传统奶酪"}, {"en": "Matcha red bean double-skin milk", "zh": "抹茶红豆双皮奶"}, {"en": "Rice wine milk roll", "zh": "奶卷"}, {"en": "Almond tofu", "zh": "杏仁豆腐"}], "tips": ["Extremely cheap for the quality — one of Beijing best value desserts", "The court cheese is nothing like Western cheese — it is closer to a firm silky pudding", "Summer only: the hand-simmered sour plum drink is extraordinary"]}, {"id": 31, "zh": "北京稻香村", "en": "Beijing Daoxiangcun", "cuisine": "palace-pastries", "cuisineLabel": "Imperial pastry institution", "vibe": ["cheap-eats", "instagrammable"], "price": "¥58/person", "stars": 2, "lat": 39.9369, "lng": 116.4168, "address": "东城区东四北大街148-150号", "desc": "The original Beijing Daoxiangcun (distinct from the Suzhou brand). Imperial Qing Dynasty décor, made-to-order pastries and beautifully packaged gift boxes. The exploding-custard ox tongue is a modern spin on the classic.", "dishes": [{"en": "Mini ox tongue pastry", "zh": "小牛舌饼"}, {"en": "Cranberry cream cheese puff", "zh": "蔓越莓乳酪酥"}, {"en": "Exploding custard ox tongue", "zh": "爆浆牛舌"}, {"en": "House number cream cake", "zh": "门牌蛋糕"}], "tips": ["This is the Beijing Daoxiangcun — distinct from the Suzhou brand of the same name", "The gift boxes are considered the best-packaged Beijing souvenir pastry", "Made fresh throughout the day — go in the afternoon for the freshest selection"]}, {"id": 32, "zh": "饽饽房七十二候饼", "en": "Bobofang 72 Seasons", "cuisine": "palace-pastries", "cuisineLabel": "Solar term heritage pastries", "vibe": ["instagrammable"], "price": "¥56/pe // ── FILTER ──
function matchFilter(r) {
  const cuisineOk = activeCuisine === "all" || r.cuisine === activeCuisine;
  const vibeOk = !activeVibe || (r.vibe && r.vibe.includes(activeVibe));
  return cuisineOk && vibeOk;
}

function renderList() {
  const filtered = restaurants.filter(matchFilter);
  document.getElementById("hCount").textContent = filtered.length + " restaurants";
  if (Object.keys(markers).length) {
    restaurants.forEach(r => {
      if (markers[r.id]) markers[r.id].el.style.display = filtered.find(f => f.id === r.id) ? "block" : "none";
    });
  }
  document.getElementById("rList").innerHTML = filtered.map(r => `
    <div class="r-item" id="li-${r.id}" onclick="pick(${r.id})">
      <div class="r-zh">${r.zh}</div>
      <div class="r-en">${r.en}</div>
      <div class="r-meta">
        <span class="r-tag">${r.cuisineLabel}</span>
        <span class="r-price">${r.price}</span>
        <span style="font-size:.8rem">${"⭐".repeat(r.stars)}</span>
      </div>
      <div class="r-desc">${r.desc}</div>
    </div>`).join("");
}

// ── CHIPS ──
document.getElementById("cuisineChips").addEventListener("click", e => {
  const btn = e.target.closest("[data-cuisine]");
  if (!btn) return;
  document.querySelectorAll("#cuisineChips .chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  activeCuisine = btn.dataset.cuisine;
  renderList();
});

document.getElementById("sceneChips").addEventListener("click", e => {
  const btn = e.target.closest("[data-vibe]");
  if (!btn) return;
  if (btn.classList.contains("scene-active")) {
    btn.classList.remove("scene-active");
    activeVibe = null;
  } else {
    document.querySelectorAll("#sceneChips .chip").forEach(c => c.classList.remove("scene-active"));
    btn.classList.add("scene-active");
    activeVibe = btn.dataset.vibe;
  }
  renderList();
});

// ── COMM BAR ──
document.getElementById("commBar").addEventListener("click", e => {
  const btn = e.target.closest("[data-zh]");
  if (!btn) return;
  document.getElementById("cmEn").textContent = btn.dataset.en;
  document.getElementById("cmZh").textContent = btn.dataset.zh;
  document.getElementById("cmPinyin").textContent = btn.dataset.pinyin;
  document.getElementById("commModal").classList.add("open");
});

function copyCommModal() {
  navigator.clipboard.writeText(document.getElementById("cmZh").textContent).then(() => {
    const b = document.querySelector(".comm-modal-copy");
    b.textContent = "✓ Copied!";
    setTimeout(() => b.textContent = "Copy Chinese text", 2000);
  });
}

// ── PICK RESTAURANT ──
function pick(id) {
  document.querySelectorAll(".r-item").forEach(e => e.classList.remove("active"));
  const li = document.getElementById("li-" + id);
  if (li) { li.classList.add("active"); li.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  Object.values(markers).forEach(m => m.el.classList.remove("active"));
  if (markers[id]) markers[id].el.classList.add("active");
  const r = restaurants.find(x => x.id === id);
  if (map) map.flyTo({ center: [r.lng, r.lat], zoom: 15, duration: 500 });
  showDetail(r);
}

// ── ORDER MODAL ──
function openOrderModal(id) {
  const r = restaurants.find(x => x.id === id);
  document.getElementById("mTitle").textContent = r.en + " · " + r.zh;
  document.getElementById("mZh").textContent = r.dishes.map(d => d.zh).join(" · ");
  document.getElementById("mDishes").innerHTML = r.dishes.map(d =>
    `<div class="modal-dish"><span>${d.en}</span><span class="modal-dish-zh">${d.zh}</span></div>`).join("");
  document.getElementById("orderModal").classList.add("open");
}

function copyOrderModal() {
  const t = document.getElementById("mTitle").textContent + "\n" + document.getElementById("mZh").textContent;
  navigator.clipboard.writeText(t).then(() => {
    const b = document.querySelector(".modal-copy");
    b.textContent = "✓ Copied!";
    setTimeout(() => b.textContent = "Copy Chinese text", 2000);
  });
}

// ── MAP ──
function setupMarkers(center, zoom) {
  map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/light-v11",
    center: center,
    zoom: zoom,
    attributionControl: false
  });
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
  map.on("load", () => {
    restaurants.forEach(r => {
      const el = document.createElement("div");
      el.className = "map-marker" + (r.stars >= 3 ? " star3" : r.stars >= 2 ? " star2" : "");
      el.addEventListener("click", () => pick(r.id));
      markers[r.id] = {
        marker: new mapboxgl.Marker({ element: el, anchor: "bottom" }).setLngLat([r.lng, r.lat]).addTo(map),
        el
      };
    });
    renderList();
  });
}

function initMap() {
  mapboxgl.accessToken = "pk.eyJ1IjoidHpoYW4xIiwiYSI6ImNtcGN1Z2EwNzAxaXoyc3NjYnM3b2E0am8ifQ.5DfO7viMVtyeTxM1hxYsvg";
  if (restaurants.length) {
    const params2 = new URLSearchParams(window.location.search);
    fetch("data/" + (params2.get("city") || "shanghai") + ".json")
      .then(r => r.json()).then(data => setupMarkers(data.center, data.zoom));
  } else {
    // wait for data to load, setupMarkers called from fetch
    window._mapReady = true;
  }
}
</script>
